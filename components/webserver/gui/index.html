<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>M5Stack Speed - File Manager</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="titlebar">
    <div class="titlebar-dots"><span></span><span></span><span></span></div>
    <h1>File Manager</h1>
  </div>

  <main class="window">
    <div class="toolbar">
      <div class="segmented-control" id="storeControl">
        <label class="segment"><input type="radio" name="store" value="sd" checked><span>SD Card</span></label>
        <label class="segment"><input type="radio" name="store" value="fs"><span>LittleFS</span></label>
      </div>

      <div class="toolbar-spacer"></div>

      <div class="upload-row">
        <input type="file" id="uploadFile">
        <button id="uploadButton" class="btn">Upload</button>
        <button id="refreshButton" class="btn btn-primary">Refresh</button>
      </div>
    </div>

    <div class="card">
      <table id="fileTable">
        <thead>
          <tr><th>Name</th><th>Size</th><th></th><th>Distance</th><th>Avg Speed</th></tr>
        </thead>
        <tbody id="fileTableBody"></tbody>
      </table>
    </div>

    <p id="statusMessage"></p>
  </main>

  <script src="/app.js"></script>
</body>
</html>
